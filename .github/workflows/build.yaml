name: Build ARM64 executable

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 make libssl-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Get version
        run: |
          VERSION=$(grep -m1 "VERSION" Makefile | sed "s/.*= *//")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        run: make prod

      - name: Create GitHub Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: build/ptrans-rgb
          make_latest: true
          overwrite: true
